<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1260 566" width="1260" height="566" role="img" aria-label="Три варианта одной программы. Без буфера: прием в горутине синхронизирован до завершения отправки в main, поэтому запись payload упорядочена до чтения. С буфером на 1: отправка сразу кладет значение в буфер и завершается, связи от горутины к main нет, main читает 0. С буфером на 1 и второй отправкой: первый прием синхронизирован до завершения второй отправки, связь возвращается.">
<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --code-bg: #f1efe9; --warn: #a3431b;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --code-bg: #22211f; --warn: #ef8a5c;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 14.5px; }
.diagram .code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; }
.diagram .lbl { fill: var(--muted); font-size: 13px; }
.diagram .ttl { fill: var(--accent); font-size: 17px; font-weight: 700; }
.diagram .pt { font-size: 15.5px; font-weight: 700; }
.diagram .hdt { fill: var(--muted); font-size: 13.5px; font-weight: 600; }
.diagram .sep { stroke: var(--rule); stroke-width: 1.5; }
.diagram .note { fill: var(--code-bg); stroke: var(--rule); stroke-width: 1.5; }
.diagram .note.ok { stroke: var(--accent); stroke-width: 2; }
.diagram .note.w { stroke: var(--warn); stroke-width: 2; }
.diagram .sb { stroke: var(--fg); stroke-width: 2; fill: none; marker-end: url(#ah-fg); }
.diagram .go { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#ah-mu); }
.diagram .sy { stroke: var(--accent); stroke-width: 3; fill: none; marker-end: url(#ah-ok); }
.diagram .ahfg { fill: var(--fg); }
.diagram .ahok { fill: var(--accent); }
.diagram .ahmu { fill: var(--muted); }
.diagram .okt { fill: var(--accent); font-weight: 700; }
.diagram .wt { fill: var(--warn); font-weight: 700; }
.diagram .x { stroke: var(--warn); stroke-width: 3; }
</style>
<defs><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahfg" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahmu" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bgr" width="1260" height="566"/>
<text class="ttl" x="24.0" y="30.0" text-anchor="start">Демо 4: откуда берется связь от записи payload к чтению</text>
<text class="pt" x="210.0" y="68.0" text-anchor="middle">случай 04: без буфера</text>
<text class="hdt" x="113.4" y="98.0" text-anchor="middle">main</text>
<text class="hdt" x="315.0" y="98.0" text-anchor="middle">горутина</text>
<line class="sep" x1="420.0" y1="52" x2="420.0" y2="526"/>
<text class="pt" x="630.0" y="68.0" text-anchor="middle">случай 05: буфер на 1</text>
<text class="hdt" x="533.4" y="98.0" text-anchor="middle">main</text>
<text class="hdt" x="735.0" y="98.0" text-anchor="middle">горутина</text>
<line class="sep" x1="840.0" y1="52" x2="840.0" y2="526"/>
<text class="pt" x="1050.0" y="68.0" text-anchor="middle">05b: буфер на 1, две отправки</text>
<text class="hdt" x="953.4" y="98.0" text-anchor="middle">main</text>
<text class="hdt" x="1155.0" y="98.0" text-anchor="middle">горутина</text>
<rect class="note " x="58.4" y="135.0" width="110.0" height="30" rx="6"/>
<text class="code" x="113.4" y="155.0" text-anchor="middle">go func()</text>
<rect class="note " x="258.9" y="195.0" width="112.2" height="30" rx="6"/>
<text class="code" x="315.0" y="215.0" text-anchor="middle">payload = 1</text>
<rect class="note " x="260.0" y="255.0" width="110.0" height="30" rx="6"/>
<text class="code" x="315.0" y="275.0" text-anchor="middle">&lt;-c</text>
<rect class="note " x="28.6" y="315.0" width="169.6" height="30" rx="6"/>
<text class="code" x="113.4" y="335.0" text-anchor="middle">c &lt;- 0 завершилась</text>
<rect class="note " x="45.0" y="375.0" width="136.8" height="30" rx="6"/>
<text class="code" x="113.4" y="395.0" text-anchor="middle">sink = payload</text>
<line class="go" x1="168.4" y1="150.0" x2="254.9" y2="210.0"/>
<line class="sb" x1="315.0" y1="227.0" x2="315.0" y2="251.0"/>
<line class="sb" x1="113.4" y1="167.0" x2="113.4" y2="311.0"/>
<line class="sb" x1="113.4" y1="347.0" x2="113.4" y2="371.0"/>
<line class="sy" x1="260.0" y1="270.0" x2="202.2" y2="330.0"/>
<text class="okt" x="315.0" y="335.0" text-anchor="middle">прием → отправка</text>
<rect class="note ok" x="40.0" y="456.0" width="340" height="69" rx="6"/>
<text class="okt" x="210.0" y="478.0" text-anchor="middle">связь есть: main читает 1</text>
<text class="lbl" x="210.0" y="497.0" text-anchor="middle">в 100000 из 100000</text>
<text class="lbl" x="210.0" y="516.0" text-anchor="middle">-race: 0 из 20</text>
<rect class="note " x="478.4" y="135.0" width="110.0" height="30" rx="6"/>
<text class="code" x="533.4" y="155.0" text-anchor="middle">go func()</text>
<rect class="note " x="460.9" y="195.0" width="145.0" height="30" rx="6"/>
<text class="code" x="533.4" y="215.0" text-anchor="middle">c &lt;- 0: в буфер</text>
<rect class="note " x="465.0" y="255.0" width="136.8" height="30" rx="6"/>
<text class="code" x="533.4" y="275.0" text-anchor="middle">sink = payload</text>
<rect class="note " x="678.9" y="315.0" width="112.2" height="30" rx="6"/>
<text class="code" x="735.0" y="335.0" text-anchor="middle">payload = 1</text>
<rect class="note " x="680.0" y="375.0" width="110.0" height="30" rx="6"/>
<text class="code" x="735.0" y="395.0" text-anchor="middle">&lt;-c</text>
<line class="go" x1="588.4" y1="150.0" x2="674.9" y2="330.0"/>
<line class="sb" x1="533.4" y1="167.0" x2="533.4" y2="191.0"/>
<line class="sb" x1="533.4" y1="227.0" x2="533.4" y2="251.0"/>
<line class="sb" x1="735.0" y1="347.0" x2="735.0" y2="371.0"/>
<line class="x" x1="525.4" y1="322.0" x2="541.4" y2="338.0"/>
<line class="x" x1="525.4" y1="338.0" x2="541.4" y2="322.0"/>
<text class="wt" x="533.4" y="360.0" text-anchor="middle">связи к main нет</text>
<rect class="note w" x="460.0" y="456.0" width="340" height="69" rx="6"/>
<text class="wt" x="630.0" y="478.0" text-anchor="middle">связи нет: main читает 0</text>
<text class="lbl" x="630.0" y="497.0" text-anchor="middle">в 99996–100000 из 100000</text>
<text class="lbl" x="630.0" y="516.0" text-anchor="middle">-race: 20 из 20</text>
<rect class="note " x="898.4" y="135.0" width="110.0" height="30" rx="6"/>
<text class="code" x="953.4" y="155.0" text-anchor="middle">go func()</text>
<rect class="note " x="880.9" y="195.0" width="145.0" height="30" rx="6"/>
<text class="code" x="953.4" y="215.0" text-anchor="middle">c &lt;- 0: в буфер</text>
<rect class="note " x="1098.9" y="225.0" width="112.2" height="30" rx="6"/>
<text class="code" x="1155.0" y="245.0" text-anchor="middle">payload = 1</text>
<rect class="note " x="1086.6" y="285.0" width="136.8" height="30" rx="6"/>
<text class="code" x="1155.0" y="305.0" text-anchor="middle">&lt;-c: 1-й прием</text>
<rect class="note " x="852.2" y="345.0" width="202.4" height="30" rx="6"/>
<text class="code" x="953.4" y="365.0" text-anchor="middle">2-я c &lt;- 0 завершилась</text>
<rect class="note " x="885.0" y="405.0" width="136.8" height="30" rx="6"/>
<text class="code" x="953.4" y="425.0" text-anchor="middle">sink = payload</text>
<line class="go" x1="1008.4" y1="150.0" x2="1094.9" y2="240.0"/>
<line class="sb" x1="953.4" y1="167.0" x2="953.4" y2="191.0"/>
<line class="sb" x1="953.4" y1="227.0" x2="953.4" y2="341.0"/>
<line class="sb" x1="1155.0" y1="257.0" x2="1155.0" y2="281.0"/>
<line class="sb" x1="953.4" y1="377.0" x2="953.4" y2="401.0"/>
<line class="sy" x1="1086.6" y1="300.0" x2="1058.6" y2="360.0"/>
<text class="okt" x="1155.0" y="386.0" text-anchor="middle">k = 1, C = 1:</text>
<text class="okt" x="1155.0" y="405.0" text-anchor="middle">прием 1 → отправка 2</text>
<rect class="note ok" x="880.0" y="456.0" width="340" height="69" rx="6"/>
<text class="okt" x="1050.0" y="478.0" text-anchor="middle">связь вернулась: main читает 1</text>
<text class="lbl" x="1050.0" y="497.0" text-anchor="middle">в 100000 из 100000</text>
<text class="lbl" x="1050.0" y="516.0" text-anchor="middle">-race: 0 из 20</text>
<text class="lbl" x="24.0" y="550.0" text-anchor="start">Стрелка вниз: порядок внутри горутины. Синяя: synchronized before. Пунктир: go. go_mem.html L415–418, L455–457; chan.go:235–249. go1.27.1</text>
</svg>
