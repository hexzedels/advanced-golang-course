<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1040 606" width="1040" height="606" role="img" aria-label="Классическое чередование. G1 прочитал old = A и next = B. G2 снял A, G3 снял B, G2 вернул A. CAS у G1 проходит, top = B, хотя B держит G3. Потом G3 кладет B: top уже B, поэтому B.next = B, и стек замыкается на себя.">
<style>
.diagram {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --rule: #dcd9d1;
  --accent: #0b6e8a; --code-bg: #f1efe9; --warn: #a3431b;
}
@media (prefers-color-scheme: dark) { .diagram {
  --bg: #161615; --fg: #ecebe6; --muted: #9b9a94; --rule: #3a3936;
  --accent: #5cc3dd; --code-bg: #22211f; --warn: #ef8a5c;
} }
.diagram { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.diagram .bgr { fill: var(--bg); }
.diagram text { fill: var(--fg); font-size: 15px; }
.diagram .lbl { fill: var(--muted); font-size: 13.5px; }
.diagram .ttl { fill: var(--accent); font-size: 17px; font-weight: 700; }
.diagram .hd { fill: var(--code-bg); stroke: var(--fg); stroke-width: 2; }
.diagram .hdt { font-weight: 700; }
.diagram .life { stroke: var(--rule); stroke-width: 3; }
.diagram .park { stroke: var(--muted); stroke-width: 3; stroke-dasharray: 6 6; }
.diagram .note { fill: var(--code-bg); stroke: var(--rule); stroke-width: 1.5; }
.diagram .note.ok { stroke: var(--accent); stroke-width: 2; }
.diagram .note.w { stroke: var(--warn); stroke-width: 2; }
.diagram .note.plain { fill: var(--bg); stroke: none; }
.diagram .chip { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.diagram .chipt { fill: var(--accent); font-size: 13.5px; font-weight: 700; }
.diagram .ar { stroke: var(--fg); stroke-width: 2; fill: none; marker-end: url(#ah-fg); }
.diagram .ar.ok { stroke: var(--accent); marker-end: url(#ah-ok); }
.diagram .ar.w { stroke: var(--warn); marker-end: url(#ah-w); }
.diagram .ar.d { stroke-dasharray: 7 5; }
.diagram .ahfg { fill: var(--fg); }
.diagram .ahok { fill: var(--accent); }
.diagram .ahw { fill: var(--warn); }
.diagram .okt { fill: var(--accent); font-weight: 600; }
.diagram .wt { fill: var(--warn); font-weight: 600; }
.diagram .x { stroke: var(--warn); stroke-width: 3; }
</style>
<defs><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahfg" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahw" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bgr" width="1040" height="606"/>
<text class="ttl" x="24" y="32" text-anchor="start">Классический ABA: B уже сняли, а CAS возвращает его наверх</text>
<text class="lbl" x="24" y="62" text-anchor="start">шаг</text>
<text class="lbl" x="470" y="62" text-anchor="start">стек после шага: top слева</text>
<line class="life" x1="24" y1="84" x2="1016" y2="84" style="stroke-width:1"/>
<text class="hdt" x="24" y="114" text-anchor="start">G1</text>
<text x="74" y="114" text-anchor="start">pop: old = A, next = B</text>
<text class="lbl" x="470" y="114" text-anchor="start">top</text>
<line class="ar" x1="504" y1="109" x2="526" y2="109"/>
<rect class="note" x="532" y="92" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="114" text-anchor="middle">A</text>
<line class="ar" x1="582" y1="109" x2="608" y2="109"/>
<rect class="note" x="612" y="92" width="46" height="34" rx="6"/>
<text class="hdt" x="635.0" y="114" text-anchor="middle">B</text>
<line class="ar" x1="662" y1="109" x2="688" y2="109"/>
<rect class="note" x="692" y="92" width="46" height="34" rx="6"/>
<text class="hdt" x="715.0" y="114" text-anchor="middle">C</text>
<line class="ar" x1="742" y1="109" x2="768" y2="109"/>
<text class="lbl" x="780" y="114" text-anchor="start">…</text>
<line class="life" x1="24" y1="158" x2="1016" y2="158" style="stroke-width:1"/>
<text class="hdt" x="24" y="188" text-anchor="start">G2</text>
<text x="74" y="188" text-anchor="start">pop A</text>
<text class="lbl" x="470" y="188" text-anchor="start">top</text>
<line class="ar" x1="504" y1="183" x2="526" y2="183"/>
<rect class="note" x="532" y="166" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="188" text-anchor="middle">B</text>
<line class="ar" x1="582" y1="183" x2="608" y2="183"/>
<rect class="note" x="612" y="166" width="46" height="34" rx="6"/>
<text class="hdt" x="635.0" y="188" text-anchor="middle">C</text>
<line class="ar" x1="662" y1="183" x2="688" y2="183"/>
<text class="lbl" x="700" y="188" text-anchor="start">…</text>
<text class="lbl" x="1016" y="188" text-anchor="end">A у G2</text>
<line class="life" x1="24" y1="232" x2="1016" y2="232" style="stroke-width:1"/>
<text class="hdt" x="24" y="262" text-anchor="start">G3</text>
<text x="74" y="262" text-anchor="start">pop B</text>
<text class="lbl" x="470" y="262" text-anchor="start">top</text>
<line class="ar" x1="504" y1="257" x2="526" y2="257"/>
<rect class="note" x="532" y="240" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="262" text-anchor="middle">C</text>
<line class="ar" x1="582" y1="257" x2="608" y2="257"/>
<text class="lbl" x="620" y="262" text-anchor="start">…</text>
<text class="lbl" x="1016" y="262" text-anchor="end">A у G2, B у G3</text>
<line class="life" x1="24" y1="306" x2="1016" y2="306" style="stroke-width:1"/>
<text class="hdt" x="24" y="336" text-anchor="start">G2</text>
<text x="74" y="336" text-anchor="start">push A: A.next = C</text>
<text class="lbl" x="470" y="336" text-anchor="start">top</text>
<line class="ar" x1="504" y1="331" x2="526" y2="331"/>
<rect class="note" x="532" y="314" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="336" text-anchor="middle">A</text>
<line class="ar" x1="582" y1="331" x2="608" y2="331"/>
<rect class="note" x="612" y="314" width="46" height="34" rx="6"/>
<text class="hdt" x="635.0" y="336" text-anchor="middle">C</text>
<line class="ar" x1="662" y1="331" x2="688" y2="331"/>
<text class="lbl" x="700" y="336" text-anchor="start">…</text>
<text class="lbl" x="1016" y="336" text-anchor="end">B у G3</text>
<line class="life" x1="24" y1="380" x2="1016" y2="380" style="stroke-width:1"/>
<text class="hdt" x="24" y="410" text-anchor="start">G1</text>
<text class="wt" x="74" y="410" text-anchor="start">CAS(A, B) прошел</text>
<text class="lbl" x="470" y="410" text-anchor="start">top</text>
<line class="ar" x1="504" y1="405" x2="526" y2="405"/>
<rect class="note w" x="532" y="388" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="410" text-anchor="middle">B</text>
<line class="ar" x1="582" y1="405" x2="608" y2="405"/>
<rect class="note" x="612" y="388" width="46" height="34" rx="6"/>
<text class="hdt" x="635.0" y="410" text-anchor="middle">C</text>
<line class="ar" x1="662" y1="405" x2="688" y2="405"/>
<text class="lbl" x="700" y="410" text-anchor="start">…</text>
<text class="wt" x="1016" y="410" text-anchor="end">B и в стеке, и у G3</text>
<line class="life" x1="24" y1="454" x2="1016" y2="454" style="stroke-width:1"/>
<text class="hdt" x="24" y="484" text-anchor="start">G3</text>
<text class="wt" x="74" y="484" text-anchor="start">push B: top уже B, B.next = B</text>
<text class="lbl" x="470" y="484" text-anchor="start">top</text>
<line class="ar" x1="504" y1="479" x2="526" y2="479"/>
<rect class="note w" x="532" y="462" width="46" height="34" rx="6"/>
<text class="hdt" x="555.0" y="484" text-anchor="middle">B</text>
<path class="ar w" d="M572,496 C608,522 608,436 574,463"/>
<text class="wt" x="612" y="484" text-anchor="start">B.next = B</text>
<text class="wt" x="1016" y="484" text-anchor="end">C и ниже потеряны</text>
<text class="lbl" x="24" y="546" text-anchor="start">Так появляется cycle=true: push находит свой узел наверху и записывает n.next = n.</text>
</svg>
